version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: xfree-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xfreehack
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: always

  app:
    build: .
    container_name: xfree-app
    depends_on:
      - db
    environment:
      # Env vars override config.yaml
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: xfreehack
      DB_PORT: 5432
      DB_SSL_MODE: disable
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
    restart: always

volumes:
  postgres_data:
